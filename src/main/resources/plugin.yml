
name: VortexAuth
version: '${version}'
main: id.vortexauth.VortexAuth
api-version: '1.21'
folia-supported: true

description: Advanced authentication and security plugin for Minecraft servers.
authors:
  - VortexTeam

softdepend:
  - floodgate
  - PlaceholderAPI
  - ProtocolLib

commands:
  register:
    description: Register your account.
    usage: /register <password> <confirm-password>
    aliases:
      - reg

  login:
    description: Login to your account.
    usage: /login <password>
    aliases:
      - l

  logout:
    description: Logout from your account.

  changepassword:
    description: Change your account password.
    usage: /changepassword <old-password> <new-password>
    aliases:
      - changepass

  premium:
    description: Enable premium authentication.
    usage: /premium

  auth:
    description: Open authentication interface.

  authadmin:
    description: Manage VortexAuth.
    permission: vortexauth.admin

permissions:
  vortexauth.admin:
    description: Access all VortexAuth administration commands.
    default: op

  vortexauth.bypass:
    description: Bypass authentication.
    default: false

  vortexauth.alerts:
    description: Receive security alerts.
    default: op
