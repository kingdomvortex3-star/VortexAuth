# ==========================================
#              VORTEX AUTH
#           Main Configuration
# ==========================================

settings:
  language: id
  debug: false
  prefix: "&8[&bVortexAuth&8]"
  update-checker: true

# ==========================================
#              AUTHENTICATION
# ==========================================

authentication:
  enabled: true

  register:
    enabled: true
    min-password-length: 6
    max-password-length: 32
    require-confirmation: true

  login:
    enabled: true
    max-attempts: 5
    timeout-seconds: 60
    lock-duration-seconds: 300

  password:
    hashing: bcrypt
    bcrypt-strength: 12

  commands:
    block-before-login: true
    allowed:
      - login
      - register
      - l
      - reg

# ==========================================
#               JAVA PLAYERS
# ==========================================

java:
  enabled: true

  premium:
    enabled: true
    require-verification: true
    auto-login: true

  cracked:
    require-register: true
    require-login: true
    auto-login: false

# ==========================================
#              BEDROCK PLAYERS
# ==========================================

bedrock:
  enabled: true

  floodgate:
    enabled: true
    required: false

  auto-login:
    enabled: true
    method: xuid
    require-valid-xuid: true

  ui:
    enabled: true
    use-forms: true

# ==========================================
#               LOGIN UI
# ==========================================

ui:
  java:
    enabled: true
    title: "&8VortexAuth &7- &bLogin"
    size: 27

    buttons:
      login:
        slot: 11
        material: LIME_DYE
        name: "&a&lLOGIN"
        lore:
          - "&7Click to login."

      register:
        slot: 15
        material: BOOK
        name: "&b&lREGISTER"
        lore:
          - "&7Create your account."

# ==========================================
#                ANTI VPN
# ==========================================

anti-vpn:
  enabled: true
  action: BLOCK

  check:
    vpn: true
    proxy: true
    hosting: true
    tor: true

  cache:
    enabled: true
    duration-minutes: 60

  whitelist:
    enabled: true
    ips: []

# ==========================================
#                ANTI BOT
# ==========================================

anti-bot:
  enabled: true

  connection-limit:
    enabled: true
    max-connections-per-ip: 3

  join-protection:
    enabled: true
    minimum-join-interval-ms: 1000

  captcha:
    enabled: false

  temporary-block:
    enabled: true
    duration-seconds: 300

# ==========================================
#                 SESSION
# ==========================================

session:
  enabled: true
  save-on-quit: true

  timeout:
    enabled: true
    duration-minutes: 30

  ip-check:
    enabled: true

# ==========================================
#                 DATABASE
# ==========================================

database:
  type: SQLITE

  sqlite:
    file: data.db

  mysql:
    host: localhost
    port: 3306
    database: vortexauth
    username: root
    password: ""
    ssl: false

  pool:
    maximum-size: 10
    minimum-idle: 2
    connection-timeout: 30000

# ==========================================
#              DISCORD WEBHOOK
# ==========================================

discord:
  enabled: false
  webhook-url: ""

  events:
    register: true
    login: true
    failed-login: true
    premium-enabled: true
    vpn-blocked: true
    bot-detected: true

# ==========================================
#                SECURITY
# ==========================================

security:
  prevent-movement: true
  prevent-chat: true
  prevent-interaction: true
  prevent-inventory: true

  hide-players-before-login: true

  max-login-distance: 5

# ==========================================
#                 MESSAGES
# ==========================================

messages:
  prefix: "&8[&bVortexAuth&8] "

  register-required: "&cSilakan register terlebih dahulu!"
  login-required: "&cSilakan login terlebih dahulu!"

  register-success: "&aRegistrasi berhasil! Silakan login."
  login-success: "&aLogin berhasil! Selamat datang."

  invalid-password: "&cPassword yang kamu masukkan salah!"
  password-too-short: "&cPassword minimal 6 karakter."
  password-mismatch: "&cKonfirmasi password tidak cocok."

  already-registered: "&cAkun kamu sudah terdaftar!"
  not-registered: "&cAkun kamu belum terdaftar!"

  too-many-attempts: "&cTerlalu banyak percobaan login!"
  login-timeout: "&cWaktu login habis!"

  premium-enabled: "&aPremium authentication berhasil diaktifkan!"
  premium-verification-failed: "&cVerifikasi akun premium gagal!"

  vpn-blocked: "&cKoneksi VPN/Proxy tidak diperbolehkan!"
  bot-blocked: "&cKoneksi kamu terdeteksi sebagai bot!"

  password-changed: "&aPassword berhasil diubah!"

  no-permission: "&cKamu tidak memiliki izin!"
  player-only: "&cPerintah ini hanya untuk pemain!"
  reload-success: "&aKonfigurasi berhasil dimuat ulang!"
